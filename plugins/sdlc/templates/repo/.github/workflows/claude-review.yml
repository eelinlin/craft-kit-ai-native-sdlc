# Same review passes on every PR, for every engineer. Humans still approve via branch protection.
# Setup: run /install-github-app in Claude Code; add ANTHROPIC_API_KEY and a read token for the
# plugin marketplace repo, if private (PLUGIN_READ_TOKEN) as repo secrets.
name: Claude review
on:
  pull_request:
    types: [opened, synchronize]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
permissions:
  contents: write
  pull-requests: write
  issues: write
jobs:
  review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.PLUGIN_READ_TOKEN }}
      CLAUDE_CODE_SYNC_PLUGIN_INSTALL: "1"
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - run: gh auth setup-git
      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            Review this PR following REVIEW.md, with the sdlc plugin's artifact-standards skill and any
            standards skills enabled for this repo. Read CLAUDE.md and the intent/ folder named in the PR.
            Post findings as review comments tagged by pass and severity. Do not approve.
  respond:
    if: github.event_name != 'pull_request' && contains(github.event.comment.body, '@claude')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
